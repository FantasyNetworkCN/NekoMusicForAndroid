name: Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 接受 Android SDK 许可证
        run: yes | sdkmanager --licenses

      - name: 安装 Android SDK 组件
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.1.0-rc1"

      - name: 恢复签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/neko-release.jks"
          test -s "$RUNNER_TEMP/neko-release.jks"

      - name: 构建签名 Release Bundle
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/neko-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - name: 上传 Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: neko-music-release
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: 删除临时签名密钥
        if: always()
        run: rm -f -- "$RUNNER_TEMP/neko-release.jks"