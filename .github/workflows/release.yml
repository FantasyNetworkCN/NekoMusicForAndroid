name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # =========================
      # Android SDK
      # =========================
      - name: 配置 Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="/usr/local/lib/android/sdk"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "正在查找 sdkmanager..."

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -print \
            -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::找不到 sdkmanager"

            echo "Android SDK:"
            ls -la "$SDK_ROOT" || true

            echo "cmdline-tools:"
            ls -la "$SDK_ROOT/cmdline-tools" || true

            exit 1
          fi

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"

          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"

          echo "找到 sdkmanager:"
          echo "$SDKMANAGER"

      - name: 检查 Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo
          echo "sdkmanager:"
          command -v sdkmanager

          echo
          echo "sdkmanager 版本:"
          sdkmanager --version

      - name: 接受 Android SDK 许可证
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      - name: 安装 Android SDK 组件
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.1.0-rc1"

      # =========================
      # 签名
      # =========================
      - name: 恢复签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 未获取到"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$GITHUB_WORKSPACE/neko_key.jks"

          test -s "$GITHUB_WORKSPACE/neko_key.jks"
          chmod 600 "$GITHUB_WORKSPACE/neko_key.jks"

          echo "JKS 恢复成功"

      # =========================
      # 构建
      # =========================
      - name: 构建签名 Release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/neko_key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      # =========================
      # 检查 APK
      # =========================
      - name: 检查 APK
        shell: bash
        run: |
          set -euo pipefail

          ls -lh app/build/outputs/apk/release/*.apk

      # =========================
      # GitHub Releases
      # =========================
      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true

      # =========================
      # 清理
      # =========================
      - name: 删除签名密钥
        if: always()
        shell: bash
        run: |
          rm -f -- "$GITHUB_WORKSPACE/neko_key.jks"