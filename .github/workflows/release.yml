name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 接受 Android SDK 许可证
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      - name: 安装 Android SDK 组件
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.1.0-rc1"

      - name: 恢复签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          test -n "$KEYSTORE_BASE64"

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$GITHUB_WORKSPACE/neko_key.jks"

          test -s "$GITHUB_WORKSPACE/neko_key.jks"
          chmod 600 "$GITHUB_WORKSPACE/neko_key.jks"

      - name: 构建签名 Release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/neko_key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: 检查 APK
        shell: bash
        run: |
          set -euo pipefail
          ls -lh app/build/outputs/apk/release/*.apk

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true

      - name: 删除签名密钥
        if: always()
        shell: bash
        run: |
          rm -f -- "$GITHUB_WORKSPACE/neko_key.jks"