name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
  # 定期全量历史扫描；在历史清理完成前会失败，这是预期的“闭环校验”。
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码（含全部历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 gitleaks
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(curl -sSfL https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"].lstrip("v"))')"

          echo "gitleaks 版本: $VERSION"

          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

          gitleaks version

      - name: 增量扫描本次变更
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -n "${BASE_SHA:-}" ]; then
            RANGE="${BASE_SHA}..${HEAD_SHA}"
          elif [ -n "${BEFORE_SHA:-}" ] \
            && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${BEFORE_SHA}..${HEAD_SHA}"
          else
            RANGE=""
          fi

          if [ -z "$RANGE" ]; then
            echo "无可用提交范围，跳过增量扫描"
            exit 0
          fi

          echo "扫描范围: $RANGE"
          gitleaks detect --config .gitleaks.toml --redact --no-banner --log-opts="$RANGE"

      - name: 全量历史扫描（定期 / 手动触发）
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          gitleaks detect --config .gitleaks.toml --redact --no-banner
