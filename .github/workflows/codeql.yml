name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "20 23 * * 0"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub Actions
          - language: actions
            build-mode: none

          # Android Kotlin / Java
          - language: java-kotlin
            build-mode: manual

          # Android JNI C / C++
          - language: c-cpp
            build-mode: manual

    steps:
      # =========================
      # 检出代码
      # =========================
      - name: 检出代码
        uses: actions/checkout@v7

      # =========================
      # JDK
      # =========================
      - name: 设置 JDK
        if: matrix.language != 'actions'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # =========================
      # Android SDK
      # =========================
      - name: 配置 Android SDK
        if: matrix.language != 'actions'
        shell: bash
        run: |
          set -e

          SDK_ROOT="/usr/local/lib/android/sdk"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "正在查找 sdkmanager..."

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -print \
            -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::找不到 sdkmanager"
            echo
            echo "Android SDK:"
            ls -la "$SDK_ROOT" || true
            echo
            echo "cmdline-tools:"
            ls -la "$SDK_ROOT/cmdline-tools" || true
            exit 1
          fi

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"

          echo "找到 sdkmanager:"
          echo "$SDKMANAGER"

          echo "SDK Manager 目录:"
          echo "$SDKMANAGER_DIR"

          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"

      # =========================
      # 检查 Android SDK
      # =========================
      - name: 检查 Android SDK
        if: matrix.language != 'actions'
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo
          echo "sdkmanager:"
          command -v sdkmanager

          echo
          echo "sdkmanager 版本:"
          sdkmanager --version

      # =========================
      # 接受 SDK 许可证
      # =========================
      - name: 接受 Android SDK 许可证
        if: matrix.language != 'actions'
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      # =========================
      # 初始化 CodeQL
      # =========================
      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # =========================
      # 构建 Android
      # =========================
      #
      # java-kotlin:
      #   捕获 Kotlin / Java 编译过程
      #
      # c-cpp:
      #   如果 Gradle 配置了 CMake / NDK，
      #   assembleDebug 会触发 JNI C/C++ 编译
      #
      - name: 创建 CodeQL 临时签名密钥
        if: matrix.language != 'actions'
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/neko-codeql.jks" \
            -storepass codeql \
            -keypass codeql \
            -alias codeql \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=CodeQL"

          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/neko-codeql.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=codeql" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=codeql" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=codeql" >> "$GITHUB_ENV"

      - name: 构建 Android 项目
        if: matrix.language != 'actions'
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: 删除 CodeQL 临时签名密钥
        if: always() && matrix.language != 'actions'
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/neko-codeql.jks"
      # =========================
      # CodeQL 分析
      # =========================
      - name: 执行 CodeQL 分析
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"