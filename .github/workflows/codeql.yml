name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "20 23 * * 0"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none

          - language: java-kotlin
            build-mode: manual

          - language: c-cpp
            build-mode: manual

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 JDK
        if: matrix.language != 'actions'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 配置 Android SDK
        if: matrix.language != 'actions'
        shell: bash
        run: |
          set -e

          SDK_ROOT="/usr/local/lib/android/sdk"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "错误：找不到 sdkmanager"
            echo
            echo "Android SDK 目录："
            ls -la "$SDK_ROOT" || true
            echo
            echo "cmdline-tools："
            ls -la "$SDK_ROOT/cmdline-tools" || true
            exit 1
          fi

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"

          echo "找到 sdkmanager：$SDKMANAGER"
          echo "SDK Manager 目录：$SDKMANAGER_DIR"

          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"

          echo "ANDROID SDK 配置完成"

      - name: 检查 Android SDK
        if: matrix.language != 'actions'
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo
          echo "sdkmanager:"
          command -v sdkmanager

          echo
          echo "sdkmanager 版本:"
          sdkmanager --version

      - name: 接受 Android SDK 许可证
        if: matrix.language != 'actions'
        shell: bash
        run: |
          yes | sdkmanager --licenses

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: 构建 Android 项目
        if: matrix.language != 'actions'
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: 执行 CodeQL 分析
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"